{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2>Our Blog</h2>
  <div class="list-group">
    {% for post in posts %}
      <a href="{{ url_for('service_detail', slug=post.slug) }}" class="list-group-item list-group-item-action">
        <h5 class="mb-1">{{ post.title }}</h5>
      </a>
    {% else %}
      <p>No posts found.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
