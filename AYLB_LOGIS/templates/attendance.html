<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>📍 Logisnow Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .form { background: #fff; padding: 20px; border-radius: 12px; max-width: 420px; margin: auto; box-shadow: 0 0 10px #ccc; }
    input, button, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #10b981; color: white; font-weight: bold; cursor: pointer; }
    .btn-container { display: flex; gap: 10px; }
    .btn { flex: 1; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="form">
    <!-- <h2><img src="logo2.png" alt="LogisNow Logo" style="width:40px; height:40px; object-fit:contain; filter: brightness(0.8) invert(1);">Logisnow Attendance</h2> -->
    <div style="display: flex; justify-content: center;">
    <h3 style="display: flex; align-items: center; gap: 10px; margin: 0;">
        <img src="{{ url_for('static', filename='images/logo.png') }}" 
             alt="LogisNow Logo" 
             style="width:40px; height:40px; object-fit:contain; filter: brightness(1.2) contrast(1.1);">
        AYLB Logstics Attendance
    </h3>
    </div>

    <form id="attendanceForm">
      <input type="text" name="name" placeholder="👤 Name" id="name" required>
      <input type="text" name="empid" placeholder="🆔 Employee ID" id="empid" required>
      
      <!-- Auto GPS Location -->
      <input type="hidden" name="location" id="location" placeholder="🌍 Auto Location" readonly required>

      <!-- Manual Location Dropdown -->
      <select name="manual_location" id="manual_location" required>
        <option value="" disabled selected>✍️ Select Location</option>
        <option value="Noida-63">Noida-63</option>
        <option value="Noida-18">Noida-18</option>
        <option value="Ghaziabad">Ghaziabad</option>
        <option value="Lucknow">Lucknow</option>
        <option value="Begusarai">Begusarai</option>
        <option value="Faridabad">Faridabad</option>
      </select>

      <!-- Hidden Email field -->
      <input type="hidden" name="email" id="email" placeholder="📧 Email (Auto if possible)" readonly required>

      <input type="hidden" name="punch" id="punch">

      <div class="btn-container">
        <button type="button" class="btn" onclick="setPunch('Punch In')">Punch In</button>
        <button type="button" class="btn" onclick="setPunch('Punch Out')">Punch Out</button>
      </div>
    </form>
  </div>

  <script>
    let autoLocationFilled = false;

    // Get GPS Location
    navigator.geolocation.getCurrentPosition(
      pos => {
        const coords = pos.coords.latitude + ", " + pos.coords.longitude;
        document.getElementById("location").value = coords;
        autoLocationFilled = true;
      },
      err => {
        alert("⚠️ Please allow location access to continue.");
        autoLocationFilled = false;
      }
    );

    // Google Identity API to get email (optional fallback)
    // window.onload = () => {
    //   google.accounts.id.initialize({
    //     client_id: "YOUR_GOOGLE_CLIENT_ID", // Replace with your real client ID
    //     callback: response => {
    //       const decoded = parseJwt(response.credential);
    //       document.getElementById("email").value = decoded.email;
    //     }
    //   });
    //   google.accounts.id.prompt(); // Show login prompt if not already signed in
    // };

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = decodeURIComponent(atob(base64Url).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(base64);
    }

    function setPunch(type) {
      const name = document.getElementById('name').value.trim();
      const empid = document.getElementById('empid').value.trim();
      const autoLoc = document.getElementById('location').value.trim();

      if (!name || !empid) {
        alert("❗ Name and Employee ID are required.");
        return;
      }

      if (!autoLoc) {
        alert("❗ Location is required. Please allow GPS access.");
        return;
      }

      document.getElementById('punch').value = type;
      submitForm();
    }

    function submitForm() {
      const form = document.getElementById("attendanceForm");
      const formData = new FormData(form);

      fetch("https://script.google.com/macros/s/AKfycby1lPWCmL9zw9qiFhE_0-VsxVnXLiZv2uUsIiyQ1bC1phi-k_N0Zw2TifhrVwCR8FvPjg/exec", {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(response => {
        alert("✅ " + document.getElementById('punch').value + " Submitted!");
        form.reset();
      })
      .catch(() => {
        alert("❌ Submission Failed!");
      });
    }
  </script>
</body>
</html>
